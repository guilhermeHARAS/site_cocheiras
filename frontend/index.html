<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102f24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RADAMÉS">
  <title>Cocheira RADAMÉS</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/horse.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <section class="auth" id="auth" aria-labelledby="authTitle">
    <div class="auth__panel">
      <div class="brand brand--dark"><span class="brand__mark">R</span><span>Cocheira <b>RADAMÉS</b></span></div>
      <p class="eyebrow">GESTÃO EQUESTRE</p>
      <h1 id="authTitle">Bem-vindo</h1>
      <p class="auth__copy" id="authCopy">Entre para acessar o controle da cocheira.</p>
      <form class="auth__form" id="authForm" novalidate>
        <label class="field"><span>E-mail</span><input id="authEmail" type="email" autocomplete="username" placeholder="nome@exemplo.com" required></label>
        <label class="field"><span>Senha</span><input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="Mínimo de 6 caracteres" required></label>
        <p class="form-error" id="authError" role="alert"></p>
        <button class="button button--primary button--wide" id="authButton">Entrar</button>
      </form>
      <p class="auth__note" id="authNote"></p>
    </div>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div class="container topbar__inside">
        <div class="brand"><span class="brand__mark">R</span><span>Cocheira <b>RADAMÉS</b></span></div>
        <div class="topbar__actions"><button class="button button--install" id="installApp" type="button" hidden>Instalar</button><button class="button button--ghost" id="logout" type="button">Sair</button></div>
      </div>
    </header>

    <main class="container dashboard">
      <section class="intro">
        <div><p class="eyebrow">PAINEL DA COCHEIRA</p><h1>Controle de treinos</h1><p>Acompanhe a evolução de cada cavalo até a meta de 60 treinos.</p></div>
        <button class="button button--gold" id="addHorse" type="button"><span>＋</span> Novo cavalo</button>
      </section>

      <section class="metrics" aria-label="Resumo">
        <article><span class="metric__icon">♞</span><div><strong id="total">0</strong><small>Cavalos cadastrados</small></div></article>
        <article><span class="metric__icon">★</span><div><strong id="goals">0</strong><small>Metas alcançadas</small></div></article>
      </section>

      <section class="toolbar">
        <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar cavalo" aria-label="Buscar cavalo"></label>
        <div class="filters" role="group" aria-label="Filtros">
          <button class="filter is-active" data-filter="all">Todos</button>
          <button class="filter" data-filter="training">Em treino</button>
          <button class="filter" data-filter="goal">Concluídos</button>
        </div>
      </section>

      <section class="horse-grid" id="horseGrid" aria-live="polite"></section>
    </main>
  </div>

  <dialog class="modal" id="horseModal">
    <div class="modal__head"><div><p class="eyebrow">CADASTRO</p><h2 id="modalTitle">Novo cavalo</h2></div><button class="icon-button modal-close" type="button" aria-label="Fechar">×</button></div>
    <form id="horseForm" class="modal__form" novalidate>
      <div class="notice" id="duplicateNotice" hidden></div>
      <div class="form-grid">
        <label class="field field--full"><span>Nome do cavalo *</span><input id="name" maxlength="80" required></label>
        <label class="field field--full"><span>Foto (opcional, até 2,5 MB)</span><input id="photo" type="file" accept="image/*"></label>
        <div class="photo-preview field--full" id="photoPreview"></div>
        <label class="field"><span>Raça</span><input id="breed" maxlength="80"></label>
        <label class="field"><span>Idade</span><input id="age" type="number" min="0" max="60"></label>
        <label class="field"><span>Sexo</span><select id="sex"><option value="">Não informado</option><option>Macho</option><option>Fêmea</option><option>Castrado</option></select></label>
        <label class="field"><span>Proprietário</span><input id="owner" maxlength="100"></label>
        <label class="field"><span>Pai</span><input id="father" maxlength="80" placeholder="Nome do pai"></label>
        <label class="field"><span>Mãe</span><input id="mother" maxlength="80" placeholder="Nome da mãe"></label>
        <label class="field"><span>Quantidade de treinos</span><input id="workouts" type="number" min="0" value="0"></label>
        <label class="field field--full"><span>Observações</span><textarea id="notes" maxlength="600"></textarea></label>
      </div>
      <p class="form-error" id="horseError" role="alert"></p>
      <div class="modal__actions"><button class="button button--soft modal-close" type="button">Cancelar</button><button class="button button--primary" id="saveHorse">Salvar cavalo</button></div>
    </form>
  </dialog>

  <dialog class="modal modal--small" id="confirmModal">
    <div class="modal__head"><h2 id="confirmTitle">Confirmar</h2><button class="icon-button confirm-close" type="button" aria-label="Fechar">×</button></div>
    <div class="confirm__body"><p id="confirmText"></p><div class="modal__actions"><button class="button button--soft confirm-close">Cancelar</button><button class="button button--danger" id="confirmYes">Confirmar</button></div></div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="confetti" id="confetti"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
